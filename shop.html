<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BTBread Shop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #fdf8ed;
            --yellow-light: #fef3c0;
            --yellow: #f9e07a;
            --brown: #3b2a1a;
            --brown-mid: #6b4c2a;
            --brown-light: #a07850;
            --warm-gray: #c8b89a;
            --text: #2c1a0e;
            --text-muted: #8a6a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--text);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .container {
            width: min(1200px, 92%);
            margin: 0 auto;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--warm-gray);
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0;
        }

        .nav-logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--brown);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--brown-mid);
        }

        .nav-links a:hover {
            color: var(--brown);
        }

        /* HERO */

        .shop-hero {
            padding: 6rem 0 4rem;
            text-align: center;
            position: relative;
        }

        .shop-label {
            display: inline-block;
            background: var(--yellow);
            color: var(--brown);

            padding: 0.4rem 1rem;
            border-radius: 999px;

            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;

            margin-bottom: 1.5rem;
        }

        .shop-title {
            font-size: clamp(2.5rem, 6vw, 5rem);
            line-height: 1;
            font-weight: 900;
            color: var(--brown);
        }

        .shop-title em {
            font-style: italic;
            color: var(--brown-light);
        }

        .shop-subtitle {
            margin-top: 1.5rem;
            max-width: 650px;
            margin-inline: auto;

            color: var(--text-muted);
            line-height: 1.8;
            font-size: 1.05rem;
        }

        /* FILTERS */

        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;

            margin-top: 3rem;
        }

        .filter-btn {
            background: white;
            border: 2px solid var(--warm-gray);

            padding: 0.7rem 1.2rem;
            border-radius: 999px;

            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--brown);
            color: var(--cream);
            border-color: var(--brown);
        }

        /* PRODUCTS */

        .products-section {
            padding-bottom: 6rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: 4rem;
        }

        .product-card {
            background: white;
            border: 1px solid var(--warm-gray);
            border-radius: 1.5rem;
            overflow: hidden;
            position: relative;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .product-card:hover {
            transform: translateY(-8px);

            box-shadow:
                0 18px 45px rgba(59, 42, 26, 0.15);

            border-color: var(--brown-light);
        }

        .product-image {
            width: 100%;
            height: 240px;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: transform 0.4s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .product-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;

            background: var(--yellow);
            color: var(--brown);

            padding: 0.3rem 0.8rem;
            border-radius: 999px;

            border: 1.5px solid var(--brown);

            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;

            z-index: 2;
        }

        .product-info {
            padding: 1.5rem;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--brown);
        }

        .product-price {
            margin-top: 0.25rem;
            color: var(--brown-light);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .add-btn {
            background: var(--yellow);
            color: var(--brown);

            border: 2px solid var(--brown);

            padding: 0.6rem 1rem;
            border-radius: 999px;

            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 0.06em;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .add-btn:hover {
            background: var(--brown);
            color: var(--cream);

            transform: translateY(-2px);
        }

        /* FOOTER */

        footer {
            background: var(--brown);
            color: var(--cream);

            padding: 3rem 0 2rem;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 2rem;

            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 2rem;
        }

        .footer-text {
            color: var(--warm-gray);
            font-size: 0.85rem;
        }

        /* RESPONSIVE */

        @media (max-width: 1000px) {

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            .products-grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }

        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="container navbar">

            <a href="index.html" class="nav-logo">
                BTBread
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="#">Shop</a>
                <a href="#">Blog</a>
                <a href="#">Contact</a>
            </nav>

        </div>

    </header>

    <!-- HERO -->

    <section class="shop-hero container">

        <div class="shop-label">
            Full Bakery Menu
        </div>

        <h1 class="shop-title">
            Fresh artisan <em>bakes</em>.
        </h1>

        <p class="shop-subtitle">
            Slow-fermented sourdoughs, buttery pastries, and seasonal favourites —
            baked fresh in small batches.
        </p>

        <!-- FILTERS -->

        <div class="filter-bar">

            <button class="filter-btn active">
                All
            </button>

            <button class="filter-btn">
                Sourdough
            </button>

            <button class="filter-btn">
                Sweet
            </button>

            <button class="filter-btn">
                Savoury
            </button>

            <button class="filter-btn">
                Pastries
            </button>

        </div>

    </section>

    <!-- PRODUCTS -->

    <section class="products-section container">

        <div class="products-grid" id="products-grid"></div>

    </section>

    <!-- FOOTER -->

    <footer>

        <div class="container footer-inner">

            <div>
                <div style="font-weight:900; font-size:1.2rem;">
                    BTBread
                </div>

                <div class="footer-text" style="margin-top:0.5rem;">
                    Fresh artisan sourdough, engineered to your taste.
                </div>
            </div>

            <div class="footer-text">
                © 2026 BTBread Bakery
            </div>

        </div>

    </footer>

    <!-- PRODUCTS SCRIPT -->

    <script>

        const products = [

            {
                name: "Brown Sugar Choc Chip Sourdough",
                price: "$15.00",
                image: "assets/ChocChip.webp",
            },

            {
                name: "Honey Smoked Ham and Cheese Sourdough Foccacia",
                price: "$18.00",
                image: "assets/honeysmokedfoc.webp",
            },

            {
                name: "Jalapeno Cheddar Sourdough Foccacia",
                price: "$15.00",
                image: "assets/jalapenofoc.webp",
            },

            {
                name: "Olive and Rosemary Sourdough Foccacia",
                price: "$13.00",
                image: "assets/olivefoc.webp",
            },

            {
                name: "Lao Gan Ma Sourdough Foccacia",
                price: "$13.00",
                image: "assets/laoganmafoc.webp",
            },

            {
                name: "Lao Gan Ma Sourdough",
                price: "$12.00",
                image: "assets/laoganma.webp",
            },

            {
                name: "Sundried Tomato Sourdough",
                price: "$15.00",
                image: "assets/sundried.webp",
            },

            {
                name: "Babka",
                price: "$20.00",
                image: "assets/babka.webp",
            },

            {
                name: "Sourdough Foccacia",
                price: "$12.00",
                image: "assets/foc.webp",
            },

            {
                name: "Garlic Confit Focaccia",
                price: "$18.00",
                image: "assets/garlic.webp"
            }

        ];

        const grid = document.getElementById('products-grid');

        products.forEach(product => {

            grid.innerHTML += `

        <div class="product-card">

          ${product.badge ? `
            <div class="product-badge">
              ${product.badge}
            </div>
          ` : ''}

          <div class="product-image">

            <img
              src="${product.image}"
              alt="${product.name}"
            >

          </div>

          <div class="product-info">

            <div>

              <div class="product-name">
                ${product.name}
              </div>

              <div class="product-price">
                ${product.price}
              </div>

            </div>

            <button class="add-btn">
              Add
            </button>

        </div>

      `;

        });

    </script>

</body>

</html>
