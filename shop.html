<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BTBread Shop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #fdf8ed;
            --yellow-light: #fef3c0;
            --yellow: #f9e07a;
            --brown: #3b2a1a;
            --brown-mid: #6b4c2a;
            --brown-light: #a07850;
            --warm-gray: #c8b89a;
            --text: #2c1a0e;
            --text-muted: #8a6a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--text);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .container {
            width: min(1700px, 92%);
            margin: 0 auto;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1.5px solid var(--warm-gray);
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 0;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 1.5rem;
            color: var(--brown-mid);
        }

        .nav-links a:hover {
            color: var(--brown);
        }

        .cart-btn {
            border: 2px solid var(--brown);
            color: var(--brown);
            padding: 0.6rem 1.3rem;
            border-radius: 999px;
            font-weight: 900;
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            transition:
                transform 0.2s ease,
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }

        .cart-btn:hover {
            background: var(--brown);
            color: var(--cream);
            transform: translateY(-2px);
        }


        /* HERO */

        .shop-hero {
            padding: 6rem 0 4rem;
            text-align: center;
            position: relative;
        }

        .shop-label {
            display: inline-block;
            background: var(--yellow);
            color: var(--brown);

            padding: 0.4rem 1rem;
            border-radius: 999px;

            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;

            margin-bottom: 1.5rem;
        }

        .shop-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            line-height: 1;
            font-weight: 900;
            color: var(--brown);
        }

        .shop-title em {
            font-style: italic;
            color: var(--brown-light);
        }

        .shop-subtitle {
            font-family: 'Inter', sans-serif;
            margin-top: 1.5rem;
            max-width: 650px;
            margin-inline: auto;

            color: var(--text-muted);
            line-height: 1.8;
            font-size: 1.05rem;
        }

        /* FILTERS */

        .filter-bar {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;

            margin-top: 3rem;
        }

        .filter-btn {
            background: white;
            border: 2px solid var(--warm-gray);

            padding: 0.7rem 1.2rem;
            border-radius: 999px;

            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--brown);
            color: var(--cream);
            border-color: var(--brown);
        }

        .sort-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sort-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--brown-mid);
        }

        .sort-select {
            border: 2px solid var(--warm-gray);
            border-radius: 999px;
            padding: 0.65rem 1rem;
            background: white;
            color: var(--brown);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .sort-select:hover,
        .sort-select:focus {
            border-color: var(--brown);
        }

        /* PRODUCTS */

        .products-section {
            padding-bottom: 6rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            /* more space between cards */
            margin-top: 4rem;
        }

        .product-card {
            background: white;
            border: 1px solid var(--warm-gray);
            border-radius: 1.5rem;
            overflow: hidden;
            position: relative;

            width: 100%;
            /* remove fixed 400px */
            max-width: 400px;
            /* keeps nice sizing */

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .product-info {
            padding: 1.5rem;

            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            /* aligns button with text top */
            gap: 1rem;
        }

        .product-name {
            font-family: 'Inter', sans-serif;
            flex: 1;
            min-width: 0;
            font-weight: 900;
        }

        .product-image {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        background: #f5f5f5;
        }

        .product-image img {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;
        display: block;
        }

        .product-pricedisplay {
            font-size: 0.95rem;
            color: var(--brown-light);
            margin-top: 0.25rem;
        }

        .product-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--yellow);
            color: var(--brown);
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            border: 1.5px solid var(--brown);
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            z-index: 2;
        }

        .add-btn {
            background: var(--yellow);
            color: var(--brown);

            border: 2px solid var(--brown);

            padding: 0.6rem 1rem;
            border-radius: 999px;

            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 0.06em;

            cursor: pointer;

            transition: 0.2s ease;

            flex-shrink: 0;
            /* prevents squishing/overflow */
            align-self: flex-start;
        }

        /* FOOTER */

        footer {
            background: var(--brown);
            color: var(--cream);

            padding: 3rem 0 2rem;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 2rem;

            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 2rem;
        }

        .footer-text {
            color: var(--warm-gray);
            font-size: 0.85rem;
        }

        /* RESPONSIVE */

        @media (max-width: 1000px) {

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            .products-grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }

        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>
        <div class="container navbar">

            <a href="#" style="font-weight:200; font-size:2rem; color:var(--brown); letter-spacing:-0.02em;">
                BTBread
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="#about">Our Story</a>
                <a href="affiliates.html">Affiliates</a>
                <a href="#newsletter">Newsletter</a>
            </nav>

            <a href="#cart" class="cart-btn">🧺 Cart (0)</a>

        </div>
    </header>

    <!-- HERO -->

    <section class="shop-hero container">

        <div class="shop-label">
            Full Bakery Menu
        </div>

        <h1 class="shop-title">
            Fresh artisan <em>bakes</em>.
        </h1>

        <p class="shop-subtitle">
            Slow-fermented sourdoughs, buttery pastries, and seasonal favourites —
            baked fresh in small batches.
        </p>

        <!-- FILTERS -->

        <div class="filter-bar">

            <button class="filter-btn active" onclick="filterProducts('All')">
                All
            </button>

            <button class="filter-btn" onclick="filterProducts('sourdough')">
                Sourdough
            </button>

            <button class="filter-btn" onclick="filterProducts('focaccia')">
                Foccacia
            </button>

            <button class="filter-btn" onclick="filterProducts('savory')">
                Savoury
            </button>

            <button class="filter-btn" onclick="filterProducts('sweet')">
                Sweet
            </button>

            <button class="filter-btn" onclick="filterProducts('vegetarian')">
                Vegetarian
            </button>

            <button class="filter-btn" onclick="filterProducts('vegan-options')">
                Vegan Options
            </button>

            <div class="sort-wrapper">
                <span class="sort-label">Sort:</span>
                <select id="sort-select" class="sort-select" onchange="changeSort(this.value)">
                    <option value="name">Name</option>
                    <option value="pricedisplay-asc">pricedisplay: low to high</option>
                    <option value="pricedisplay-desc">pricedisplay: high to low</option>
                </select>
            </div>

        </div>

    </section>

    <!-- PRODUCTS -->

    <section class="products-section container">

        <div class="products-grid" id="products-grid"></div>

    </section>

    <!-- FOOTER -->

    <footer>

        <div class="container footer-inner">

            <div>
                <div style="font-weight:900; font-size:1.2rem;">
                    BTBread
                </div>

                <div class="footer-text" style="margin-top:0.5rem;">
                    Fresh artisan sourdough, engineered to your taste.
                </div>
            </div>

            <div class="footer-text">
                © 2026 BTBread Bakery
            </div>

        </div>

    </footer>

    <!-- PRODUCTS SCRIPT -->

    <script>

        const products = [

            {
                name: "Blue Cheese Sourdough Foccacia",
                pricedisplay: "$15.00",
                price: 15,
                image: "assets/bluefoc.jpg",
                badge: "Most Popular",
                tags: ["sourdough", "savory", "focaccia", "vegetarian"]
            },

            {
                name: "All-White Sourdough",
                pricedisplay: "$10.00",
                price: 10,
                image: "assets/all-white.jpg",
                badge: "The OG",
                tags: ["sourdough", "savory", "vegetarian", "vegan-options"]
            },

            {
                name: "Flax Seed Sourdough",
                pricedisplay: "$11.00",
                price: 11,
                image: "assets/Flax.jpg",
                tags: ["sourdough", "savory", "vegetarian"]
            },

            {
                name: "Brown Sugar Choc Chip Sourdough",
                pricedisplay: "$15.00",
                price: 15,
                image: "assets/ChocChip.jpg",
                tags: ["sourdough", "sweet", "vegetarian"]
            },

            {
                name: "Honey Smoked Ham and Cheese Sourdough Foccacia",
                pricedisplay: "$18.00",
                price: 18,
                image: "assets/honeysmokedfoc.jpg",
                tags: ["sourdough", "savory", "focaccia"]
            },

            {
                name: "Jalapeno Cheddar Sourdough Foccacia",
                pricedisplay: "$15.00",
                price: 15,
                image: "assets/jalapenofoc.jpg",
                tags: ["sourdough", "savory", "focaccia", "spicy"]
            },

            {
                name: "Olive and Rosemary Sourdough Foccacia",
                pricedisplay: "$13.00",
                price: 13,
                image: "assets/olivefoc.jpg",
                tags: ["sourdough", "savory", "focaccia", "vegetarian", "vegan-options"]
            },

            {
                name: "Lao Gan Ma Sourdough Foccacia",
                pricedisplay: "$13.00",
                price: 13,
                image: "assets/laoganmafoc.jpg",
                tags: ["sourdough", "savory", "focaccia", "vegetarian", "vegan-options"]
            },

            {
                name: "Lao Gan Ma Sourdough",
                pricedisplay: "$12.00",
                price: 12,
                image: "assets/laoganma.jpg",
                tags: ["sourdough", "savory", "vegetarian", "vegan-options"]
            },

            {
                name: "Sundried Tomato Sourdough",
                pricedisplay: "$15.00",
                price: 15,
                image: "assets/sundried.jpg",
                tags: ["sourdough", "savory", "vegetarian"]
            },

            {
                name: "Babka",
                pricedisplay: "$20.00",
                price: 20,
                image: "assets/babka.jpg",
                tags: ["sweet", "vegetarian", "vegan-options"]
            },

            {
                name: "Sourdough Foccacia",
                pricedisplay: "$12.00",
                price: 12,
                image: "assets/foc.jpg",
                tags: ["sourdough", "savory", "focaccia", "vegetarian", "vegan-options"]
            },

            {
                name: "Garlic Confit Focaccia",
                pricedisplay: "$18.00",
                price: 18,
                image: "assets/garlic.jpg",
                tags: ["sourdough", "savory", "focaccia", "vegetarian", "vegan-options"]
            },

            {
                name: "Curry Sourdough",
                pricedisplay: "$12.00",
                price: 12,
                image: "assets/curry.jpg",
                tags: ["sourdough", "savory", "vegetarian", "vegan-options"]
            },

            {
                name: "Omega Seed Mix",
                pricedisplay: "$15.00",
                price: 15,
                image: "assets/omega.jpg",
                tags: ["sourdough", "savory", "vegetarian", "vegan-options"]
            }

        ];

        const grid = document.getElementById('products-grid');
        let currentFilter = 'All';
        let currentSort = 'name';

        function renderProducts(productArray) {
            grid.innerHTML = '';
            productArray.forEach(product => {
                grid.innerHTML += `
                <div class="product-card">

                    ${product.badge ? `
                    <div class="product-badge">
                        ${product.badge}
                    </div>
                    ` : ''}

                    <div class="product-image">
                    <img src="${product.image}" alt="${product.name}">
                    </div>

                    <div class="product-info">

                    <div class="product-text">

                        <div class="product-name">
                        ${product.name}
                        </div>

                        <div class="product-pricedisplay">
                        ${product.pricedisplay}
                        </div>

                    </div>

                    <button class="add-btn">
                        Add to Cart
                    </button>

                    </div>

                </div>
                `;
            });
        }

        function parsepricedisplay(pricedisplayString) {
            return parseFloat(pricedisplayString.replace(/[^0-9.]/g, '')) || 0;
        }

        function sortProducts(productArray, sortBy) {
            return [...productArray].sort((a, b) => {
                if (sortBy === 'pricedisplay-asc') {
                    return parsepricedisplay(a.pricedisplay) - parsepricedisplay(b.pricedisplay);
                }

                if (sortBy === 'pricedisplay-desc') {
                    return parsepricedisplay(b.pricedisplay) - parsepricedisplay(a.pricedisplay);
                }

                return a.name.localeCompare(b.name);
            });
        }

        function applyFiltersAndSort() {
            let filteredProducts;

            if (currentFilter === 'All') {
                filteredProducts = products;
            } else {
                filteredProducts = products.filter(
                    product => product.tags.some(tag => tag === currentFilter)
                );
            }

            const sortedProducts = sortProducts(filteredProducts, currentSort);
            renderProducts(sortedProducts);
        }

        function filterProducts(tags) {
            currentFilter = tags;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle(
                    'active',
                    btn.textContent.trim().toLowerCase() === tags.toLowerCase()
                );
            });
            applyFiltersAndSort();
        }

        function changeSort(sortValue) {
            currentSort = sortValue;
            applyFiltersAndSort();
        }

        applyFiltersAndSort();
    </script>

</body>

</html>
