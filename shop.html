<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTBread Shop</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #fdf8ed;
            --yellow: #f9e07a;
            --brown: #3b2a1a;
            --brown-mid: #6b4c2a;
            --brown-light: #a07850;
            --warm-gray: #c8b89a;
            --text: #2c1a0e;
            --text-muted: #8a6a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, sans-serif;
            background: var(--cream);
            color: var(--text);
            overflow-x: hidden;
        }

        .container {
            width: min(1500px, 92%);
            margin: 0 auto;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--warm-gray);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            text-transform: uppercase;
            font-size: 1rem;
            color: var(--brown-mid);
        }

        .cart-btn {
            border: 2px solid var(--brown);
            padding: .5rem 1rem;
            border-radius: 999px;
            font-weight: 800;
        }

        /* HERO */
        .shop-hero {
            text-align: center;
            padding: 5rem 0 2rem;
        }

        .shop-title {
            font-size: 3rem;
            font-weight: 900;
            color: var(--brown);
        }

        /* FILTER */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .filter-btn {
            padding: .6rem 1rem;
            border-radius: 999px;
            border: 2px solid var(--warm-gray);
            background: white;
            cursor: pointer;
            font-weight: 800;
        }

        .filter-btn.active {
            background: var(--brown);
            color: white;
            border-color: var(--brown);
        }

        /* PRODUCTS */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .product-card {
            background: white;
            border: 1px solid var(--warm-gray);
            border-radius: 1.2rem;
            overflow: hidden;
        }

        .product-image {
            aspect-ratio: 1/1;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            display: flex;
            justify-content: space-between;
            padding: 1rem;
            gap: 1rem;
        }

        .product-name {
            font-weight: 900;
        }

        .product-price {
            color: var(--brown-light);
            margin-top: .2rem;
        }

        .add-btn {
            background: var(--yellow);
            border: 2px solid var(--brown);
            border-radius: 999px;
            font-weight: 900;
            cursor: pointer;
            padding: .5rem .8rem;
        }

        /* CART */
        .cart-popup {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            display: flex;
            justify-content: flex-end;
        }

        .cart-popup.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-panel {
            width: 420px;
            background: var(--cream);
            padding: 2rem;
            transform: translateX(100%);
            transition: .25s;
            display: flex;
            flex-direction: column;
        }

        .cart-popup.active .cart-panel {
            transform: translateX(0);
        }

        .cart-item {
            background: white;
            padding: 1rem;
            border: 1px solid var(--warm-gray);
            border-radius: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .qty-btn {
            border: 1px solid var(--brown);
            background: white;
            padding: .2rem .5rem;
            cursor: pointer;
            border-radius: .4rem;
        }
    </style>
</head>

<body>

    <header>
        <div class="container navbar">
            <div style="font-weight:900;">BTBread</div>

            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">Shop</a>
            </nav>

            <a href="#" id="open-cart-btn" class="cart-btn">
                🧺 Cart (<span id="cart-count">0</span>) $<span id="cart-total">0.00</span>
            </a>
        </div>
    </header>

    <section class="shop-hero container">
        <h1 class="shop-title">Fresh artisan bakes</h1>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="All" onclick="filterProducts('All')">All</button>
            <button class="filter-btn" data-filter="sourdough" onclick="filterProducts('sourdough')">Sourdough</button>
            <button class="filter-btn" data-filter="savory" onclick="filterProducts('savory')">Savory</button>
            <button class="filter-btn" data-filter="sweet" onclick="filterProducts('sweet')">Sweet</button>
        </div>
    </section>

    <section class="container">
        <div class="products-grid" id="products-grid"></div>
    </section>

    <!-- CART -->
    <div class="cart-popup" id="cart-popup">
        <div class="cart-panel">
            <h2>Your Cart</h2>
            <div id="cart-items"></div>
            <h3>Total: $<span id="popup-total">0.00</span></h3>
            <button>Checkout</button>
        </div>
    </div>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/shop.js"></script>
    <script>
        Cart.init(PRODUCTS);
    </script>

</body>

</html>
