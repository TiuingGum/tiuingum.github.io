<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTBread Shop</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #fdf8ed;
            --yellow: #f9e07a;
            --brown: #3b2a1a;
            --brown-mid: #6b4c2a;
            --brown-light: #a07850;
            --warm-gray: #c8b89a;
            --text: #2c1a0e;
            --text-muted: #8a6a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, sans-serif;
            background: var(--cream);
            color: var(--text);
            overflow-x: hidden;
        }

        .container {
            width: min(1500px, 92%);
            margin: 0 auto;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--warm-gray);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            text-transform: uppercase;
            font-size: 1rem;
            color: var(--brown-mid);
        }

        .cart-btn {
            border: 2px solid var(--brown);
            padding: .5rem 1rem;
            border-radius: 999px;
            font-weight: 800;
        }

        /* HERO */
        .shop-hero {
            text-align: center;
            padding: 5rem 0 2rem;
        }

        .shop-title {
            font-size: 3rem;
            font-weight: 900;
            color: var(--brown);
        }

        /* FILTER */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .filter-btn {
            padding: .6rem 1rem;
            border-radius: 999px;
            border: 2px solid var(--warm-gray);
            background: white;
            cursor: pointer;
            font-weight: 800;
        }

        .filter-btn.active {
            background: var(--brown);
            color: white;
            border-color: var(--brown);
        }

        /* PRODUCTS */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .product-card {
            background: white;
            border: 1px solid var(--warm-gray);
            border-radius: 1.2rem;
            overflow: hidden;
        }

        .product-image {
            aspect-ratio: 1/1;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            display: flex;
            justify-content: space-between;
            padding: 1rem;
            gap: 1rem;
        }

        .product-name {
            font-weight: 900;
        }

        .product-price {
            color: var(--brown-light);
            margin-top: .2rem;
        }

        .add-btn {
            background: var(--yellow);
            border: 2px solid var(--brown);
            border-radius: 999px;
            font-weight: 900;
            cursor: pointer;
            padding: .5rem .8rem;
        }

        /* CART */
        .cart-popup {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            display: flex;
            justify-content: flex-end;
        }

        .cart-popup.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-panel {
            width: 420px;
            background: var(--cream);
            padding: 2rem;
            transform: translateX(100%);
            transition: .25s;
            display: flex;
            flex-direction: column;
        }

        .cart-popup.active .cart-panel {
            transform: translateX(0);
        }

        .cart-item {
            background: white;
            padding: 1rem;
            border: 1px solid var(--warm-gray);
            border-radius: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .qty-btn {
            border: 1px solid var(--brown);
            background: white;
            padding: .2rem .5rem;
            cursor: pointer;
            border-radius: .4rem;
        }
    </style>
</head>

<body>

    <header>
        <div class="container navbar">
            <div style="font-weight:900;">BTBread</div>

            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">Shop</a>
            </nav>

            <a href="#" id="open-cart-btn" class="cart-btn">
                🧺 Cart (<span id="cart-count">0</span>) $<span id="cart-total">0.00</span>
            </a>
        </div>
    </header>

    <section class="shop-hero container">
        <h1 class="shop-title">Fresh artisan bakes</h1>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="All" onclick="filterProducts('All')">All</button>
            <button class="filter-btn" data-filter="sourdough" onclick="filterProducts('sourdough')">Sourdough</button>
            <button class="filter-btn" data-filter="savory" onclick="filterProducts('savory')">Savory</button>
            <button class="filter-btn" data-filter="sweet" onclick="filterProducts('sweet')">Sweet</button>
        </div>
    </section>

    <section class="container">
        <div class="products-grid" id="products-grid"></div>
    </section>

    <!-- CART -->
    <div class="cart-popup" id="cart-popup">
        <div class="cart-panel">
            <h2>Your Cart</h2>
            <div id="cart-items"></div>
            <h3>Total: $<span id="popup-total">0.00</span></h3>
            <button>Checkout</button>
        </div>
    </div>

    <script>

        let cart = JSON.parse(localStorage.getItem("btbread-cart")) || [];

        // safe migration (non-destructive)
        cart = cart.map(item => ({
            id: item.id,
            qty: item.qty || 1
        }));

        const products = [
            {
                name: "Blue Cheese Sourdough Foccacia",
                pricedisplay: "$15.00",
                price: 15,
                id: 1,
                image: "assets/bluefoc.jpg",
                tags: ["sourdough", "savory", "focaccia", "vegetarian"]
            },
            {
                name: "All-White Sourdough",
                pricedisplay: "$10.00",
                price: 10,
                id: 2,
                image: "assets/all-white.jpg",
                tags: ["sourdough", "savory", "vegetarian", "vegan-options"]
            },
            {
                name: "Flax Seed Sourdough",
                pricedisplay: "$11.00",
                price: 11,
                id: 3,
                image: "assets/Flax.jpg",
                tags: ["sourdough", "savory", "vegetarian"]
            },
            {
                name: "Brown Sugar Choc Chip Sourdough",
                pricedisplay: "$15.00",
                price: 15,
                id: 4,
                image: "assets/ChocChip.jpg",
                tags: ["sourdough", "sweet", "vegetarian"]
            },
            {
                name: "Honey Smoked Ham and Cheese Sourdough Foccacia",
                pricedisplay: "$18.00",
                price: 18,
                id: 5,
                image: "assets/honeysmokedfoc.jpg",
                tags: ["sourdough", "savory", "focaccia"]
            },
            {
                name: "Jalapeno Cheddar Sourdough Foccacia",
                pricedisplay: "$15.00",
                price: 15,
                id: 6,
                image: "assets/jalapenofoc.jpg",
                tags: ["sourdough", "savory", "focaccia", "spicy"]
            },
            {
                name: "Olive and Rosemary Sourdough Foccacia",
                pricedisplay: "$13.00",
                price: 13,
                id: 7,
                image: "assets/olivefoc.jpg",
                tags: ["sourdough", "savory", "focaccia", "vegetarian", "vegan-options"]
            },
            {
                name: "Lao Gan Ma Sourdough Foccacia",
                pricedisplay: "$13.00",
                price: 13,
                id: 8,
                image: "assets/laoganmafoc.jpg",
                tags: ["sourdough", "savory", "focaccia", "vegetarian", "vegan-options"]
            },
            {
                name: "Lao Gan Ma Sourdough",
                pricedisplay: "$12.00",
                price: 12,
                id: 9,
                image: "assets/laoganma.jpg",
                tags: ["sourdough", "savory", "vegetarian", "vegan-options"]
            },
            {
                name: "Sundried Tomato Sourdough",
                pricedisplay: "$15.00",
                price: 15,
                id: 10,
                image: "assets/sundried.jpg",
                tags: ["sourdough", "savory", "vegetarian"]
            },
            {
                name: "Babka",
                pricedisplay: "$20.00",
                price: 20,
                id: 11,
                image: "assets/babka.jpg",
                tags: ["sweet", "vegetarian", "vegan-options"]
            },
            {
                name: "Sourdough Foccacia",
                pricedisplay: "$12.00",
                price: 12,
                id: 12,
                image: "assets/foc.jpg",
                tags: ["sourdough", "savory", "focaccia", "vegetarian", "vegan-options"]
            },
            {
                name: "Garlic Confit Focaccia",
                pricedisplay: "$18.00",
                price: 18,
                id: 13,
                image: "assets/garlic.jpg",
                tags: ["sourdough", "savory", "focaccia", "vegetarian", "vegan-options"]
            },
            {
                name: "Curry Sourdough",
                pricedisplay: "$12.00",
                price: 12,
                id: 14,
                image: "assets/curry.jpg",
                tags: ["sourdough", "savory", "vegetarian", "vegan-options"]
            },
            {
                name: "Omega Seed Mix",
                pricedisplay: "$15.00",
                price: 15,
                id: 15,
                image: "assets/omega.jpg",
                tags: ["sourdough", "savory", "vegetarian", "vegan-options"]
            }
        ];

        let currentFilter = "All";
        let currentSort = "name";

        function saveCart() {
            localStorage.setItem("btbread-cart", JSON.stringify(cart));
        }

        function addToCart(id) {
            const item = cart.find(i => i.id === id);
            if (item) item.qty++;
            else cart.push({ id, qty: 1 });
            saveCart();
            updateCartUI();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            saveCart();
            renderCart();
            updateCartUI();
        }

        function getCartTotal() {
            return cart.reduce((sum, item) => {
                const p = products.find(x => x.id === item.id);
                return sum + (p.price * item.qty);
            }, 0);
        }

        function updateCartUI() {
            document.getElementById("cart-count").textContent =
                cart.reduce((s, i) => s + i.qty, 0);

            document.getElementById("cart-total").textContent =
                getCartTotal().toFixed(2);
        }

        function renderProducts(list) {
            const grid = document.getElementById("products-grid");
            grid.innerHTML = "";

            list.forEach(p => {
                grid.innerHTML += `
        <div class="product-card">
            <div class="product-image">
                <img src="${p.image}">
            </div>

            <div class="product-info">
                <div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.pricedisplay}</div>
                </div>

                <button class="add-btn" onclick="addToCart(${p.id})">Add</button>
            </div>
        </div>`;
            });
        }

        function filterProducts(tag) {
            currentFilter = tag;

            document.querySelectorAll(".filter-btn").forEach(b => {
                b.classList.toggle("active", b.dataset.filter === tag);
            });

            apply();
        }

        function apply() {
            let list = products;

            if (currentFilter !== "All") {
                list = list.filter(p => p.tags.includes(currentFilter));
            }

            renderProducts(list);
        }

        function renderCart() {
            const wrap = document.getElementById("cart-items");
            wrap.innerHTML = "";

            cart.forEach(item => {
                const p = products.find(x => x.id === item.id);

                wrap.innerHTML += `
        <div class="cart-item">
            <div>
                <b>${p.name}</b><br>
                $${p.price} x ${item.qty}
            </div>

            <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty(${item.id},-1)">-</button>
                <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
            </div>
        </div>`;
            });

            document.getElementById("popup-total").textContent =
                getCartTotal().toFixed(2);
        }

        /* CART OPEN */
        document.getElementById("open-cart-btn").onclick = (e) => {
            e.preventDefault();
            renderCart();
            document.getElementById("cart-popup").classList.add("active");
        };

        document.getElementById("cart-popup").onclick = (e) => {
            if (e.target.id === "cart-popup")
                e.target.classList.remove("active");
        };

        apply();
        updateCartUI();

    </script>

</body>

</html>
