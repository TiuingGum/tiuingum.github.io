<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BTBread Shop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #fdf8ed;
            --yellow: #f9e07a;
            --brown: #3b2a1a;
            --brown-mid: #6b4c2a;
            --warm-gray: #c8b89a;
            --text: #2c1a0e;
            --text-muted: #8a6a4a;

            /* FIX 1 */
            --brown-light: #8a6a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--text);
            overflow-x: hidden;
            position: relative;
        }

        /* WATERMARK FIXED */
        body::before {
            content: '';

            position: fixed;
            left: -8rem;
            top: 50%;
            transform: translateY(-50%);

            width: 1500px;
            height: 1500px;

            background-image: url('assets/BTBreadLogoNoText.svg');
            background-repeat: no-repeat;
            background-size: contain;
            background-position: center;

            opacity: 0.03;
            filter: blur(0.5px);

            pointer-events: none;
            z-index: 0;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .container {
            width: min(1500px, 92%);
            margin: 0 auto;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1.5px solid var(--warm-gray);
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 0;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 1.2rem;
            color: var(--brown-mid);
        }

        .nav-links a:hover {
            color: var(--brown);
        }

        .cart-btn {
            border: 2px solid var(--brown);
            color: var(--brown);
            padding: 0.6rem 1.3rem;
            border-radius: 999px;
            font-weight: 900;
            font-size: 0.82rem;
            letter-spacing: 0.08em;

            display: inline-flex;
            align-items: center;
            gap: 0.25rem;

            transition: all 0.2s ease;
        }

        .cart-btn:hover {
            background: var(--brown);
            color: var(--cream);
            transform: translateY(-2px);
        }

        .shop-hero {
            padding: 6rem 0 4rem;
            text-align: center;
            position: relative;
            isolation: isolate;
        }

        .shop-hero>* {
            position: relative;
            z-index: 1;
        }

        .shop-label {
            display: inline-block;
            background: var(--yellow);
            color: var(--brown);
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .shop-title {
            font-size: clamp(2.5rem, 6vw, 5rem);
            line-height: 1;
            font-weight: 900;
            color: var(--brown);
        }

        .shop-subtitle {
            margin-top: 1.5rem;
            max-width: 650px;
            margin-inline: auto;
            color: var(--text-muted);
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 3rem;
        }

        .filter-btn {
            background: white;
            border: 2px solid var(--warm-gray);
            padding: 0.7rem 1.2rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--brown);
            color: var(--cream);
        }

        .sort-select {
            border: 2px solid var(--warm-gray);
            border-radius: 999px;
            padding: 0.65rem 1rem;
            background: white;
            font-weight: 700;
        }

        .products-section {
            padding-bottom: 6rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
            margin-top: 4rem;
        }

        .product-card {
            background: white;
            border: 1px solid var(--warm-gray);
            border-radius: 1.5rem;
            overflow: hidden;
            max-width: 400px;
            transition: 0.25s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .product-image {
            aspect-ratio: 1 / 1;
            background: #f5f5f5;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        .product-name {
            font-weight: 900;
        }

        .add-btn {
            background: var(--yellow);
            border: 2px solid var(--brown);
            padding: 0.6rem 1rem;
            border-radius: 999px;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <div class="container navbar">
            <a href="#">BTBread</a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="#about">Our Story</a>
                <a href="affiliates.html">Affiliates</a>
                <a href="#newsletter">Newsletter</a>
            </nav>

            <a href="#" class="cart-btn">
                🧺 Cart (<span id="cart-count">0</span>) — <span id="cart-total">$0.00</span>
            </a>
        </div>
    </header>

    <section class="shop-hero container">
        <div class="shop-label">Full Bakery Menu</div>
        <h1 class="shop-title">Fresh artisan bakes.</h1>
        <p class="shop-subtitle">
            Slow-fermented sourdoughs, buttery pastries, and seasonal favourites.
        </p>

        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterProducts('All')">All</button>
            <button class="filter-btn" onclick="filterProducts('sourdough')">Sourdough</button>
            <button class="filter-btn" onclick="filterProducts('focaccia')">Focaccia</button>
            <button class="filter-btn" onclick="filterProducts('savory')">Savoury</button>
            <button class="filter-btn" onclick="filterProducts('sweet')">Sweet</button>

            <select class="sort-select" onchange="changeSort(this.value)">
                <option value="name">Name</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
            </select>
        </div>
    </section>

    <section class="products-section container">
        <div class="products-grid" id="products-grid"></div>
    </section>

</body>
</html>
