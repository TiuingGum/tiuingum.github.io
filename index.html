    * {

    .page {

    }

    .background {
      position: absolute;
      inset: 0;
      background:

        url("assets/Bakery BG.webp") center / cover no-repeat;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 2;
      padding: 28px 6%;
    }

      justify-content: center;

    }

      height: auto;

      flex: 1;
      display: flex;

      width: min(720px, 100%);

      border-radius: 28px;
      padding: clamp(40px, 7vw, 76px) clamp(24px, 7vw, 70px);
      text-align: center;
      box-shadow: 0 20px 70px rgba(74, 48, 36, 0.12);
      backdrop-filter: blur(8px);
    }

    .bread-icon {
      font-size: 3rem;

      background: var(--cream);

    }

    .return-date strong {
      display: block;
      margin-top: 4px;
      font-size: 1.15rem;
      color: var(--brown);
    }

    .social {
      margin-top: 32px;

      }

      .holiday-card {
        border-radius: 22px;
      }

      .message {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
